# YOLOv8s-Seg + Coordinate Attention + GELU
# Proposed lightweight architecture for smartphone-based pothole segmentation

nc: 80

scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# ---------------------------------------------------------
# BACKBONE
# ---------------------------------------------------------

backbone:

  # [from, repeats, module, args]

  # P1/2
  - [-1, 1, ConvGELU, [64, 3, 2]]        # 0

  # P2/4
  - [-1, 1, ConvGELU, [128, 3, 2]]       # 1
  - [-1, 3, C2f, [128, True]]             # 2

  # P3/8 - Small features
  - [-1, 1, ConvGELU, [256, 3, 2]]       # 3
  - [-1, 6, C2f, [256, True]]             # 4
  - [-1, 1, CoordinateAttention, [32]]   # 5 - CA P3

  # P4/16 - Medium features
  - [-1, 1, ConvGELU, [512, 3, 2]]       # 6
  - [-1, 6, C2f, [512, True]]             # 7
  - [-1, 1, CoordinateAttention, [32]]   # 8 - CA P4

  # P5/32 - Large/global features
  - [-1, 1, ConvGELU, [1024, 3, 2]]      # 9
  - [-1, 3, C2f, [1024, True]]            # 10
  - [-1, 1, SPPF, [1024, 5]]              # 11
  - [-1, 1, CoordinateAttention, [32]]   # 12 - CA P5


# ---------------------------------------------------------
# HEAD
# ---------------------------------------------------------

head:

  # P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13

  # Concatenate with CA-enhanced P4
  - [[-1, 8], 1, Concat, [1]]                   # 14

  - [-1, 3, C2f, [512]]                         # 15


  # P4 → P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16

  # Concatenate with CA-enhanced P3
  - [[-1, 5], 1, Concat, [1]]                   # 17

  - [-1, 3, C2f, [256]]                         # 18 P3/8


  # P3 → P4
  - [-1, 1, Conv, [256, 3, 2]]                 # 19

  - [[-1, 15], 1, Concat, [1]]                 # 20

  - [-1, 3, C2f, [512]]                         # 21 P4/16


  # P4 → P5
  - [-1, 1, Conv, [512, 3, 2]]                 # 22

  - [[-1, 12], 1, Concat, [1]]                 # 23

  - [-1, 3, C2f, [1024]]                        # 24 P5/32


  # Segmentation head
  - [[18, 21, 24], 1, Segment, [nc, 32, 256]]