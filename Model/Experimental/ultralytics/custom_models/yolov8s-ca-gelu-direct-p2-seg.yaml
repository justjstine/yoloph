# YOLOv8s-Seg
# + Coordinate Attention
# + Global GELU
# + Direct P2/P3/P4/P5 Segmentation Head

nc: 1

scale: s

# Replace default SiLU in standard Ultralytics Conv blocks
activation: nn.GELU()

scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]


# ============================================================
# BACKBONE
# ============================================================

backbone:

  # P1/2
  - [-1, 1, Conv, [64, 3, 2]]             # 0

  # P2/4
  - [-1, 1, Conv, [128, 3, 2]]            # 1
  - [-1, 3, C2f, [128, True]]             # 2 P2

  # P3/8
  - [-1, 1, Conv, [256, 3, 2]]            # 3
  - [-1, 6, C2f, [256, True]]             # 4
  - [-1, 1, CoordinateAttention, [32]]     # 5 P3

  # P4/16
  - [-1, 1, Conv, [512, 3, 2]]            # 6
  - [-1, 6, C2f, [512, True]]             # 7
  - [-1, 1, CoordinateAttention, [32]]     # 8 P4

  # P5/32
  - [-1, 1, Conv, [1024, 3, 2]]           # 9
  - [-1, 3, C2f, [1024, True]]            # 10
  - [-1, 1, SPPF, [1024, 5]]              # 11
  - [-1, 1, CoordinateAttention, [32]]     # 12 P5


# ============================================================
# HEAD
# ============================================================

head:

  # ----------------------------------------------------------
  # P5 -> P4
  # ----------------------------------------------------------

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 8], 1, Concat, [1]]                    # 14
  - [-1, 3, C2f, [512]]                          # 15 P4


  # ----------------------------------------------------------
  # P4 -> P3
  # ----------------------------------------------------------

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 5], 1, Concat, [1]]                    # 17
  - [-1, 3, C2f, [256]]                          # 18 P3


  # ----------------------------------------------------------
  # P3 -> P2
  # ----------------------------------------------------------

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 19
  - [[-1, 2], 1, Concat, [1]]                    # 20
  - [-1, 3, C2f, [128]]                          # 21 P2


  # ----------------------------------------------------------
  # P2 -> P3
  # ----------------------------------------------------------

  - [-1, 1, Conv, [256, 3, 2]]                   # 22
  - [[-1, 18], 1, Concat, [1]]                   # 23
  - [-1, 3, C2f, [256]]                          # 24 P3


  # ----------------------------------------------------------
  # P3 -> P4
  # ----------------------------------------------------------

  - [-1, 1, Conv, [512, 3, 2]]                   # 25
  - [[-1, 15], 1, Concat, [1]]                   # 26
  - [-1, 3, C2f, [512]]                          # 27 P4


  # ----------------------------------------------------------
  # P4 -> P5
  # ----------------------------------------------------------

  - [-1, 1, Conv, [1024, 3, 2]]                  # 28
  - [[-1, 12], 1, Concat, [1]]                   # 29
  - [-1, 3, C2f, [1024]]                         # 30 P5


  # ----------------------------------------------------------
  # DIRECT INSTANCE SEGMENTATION:
  # P2 / P3 / P4 / P5
  # ----------------------------------------------------------

  - [[24, 21, 27, 30], 1, Segment, [nc, 32, 256]]  # 31